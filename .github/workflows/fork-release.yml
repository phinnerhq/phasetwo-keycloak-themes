# Fork-only: Phase Two's workflows are synced from their internal repo, so this lives in its own file.
name: Fork release

on:
  push:
    tags:
      - "v*-fork.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      # v0.85-fork.1 -> 0.85-fork.1, so the jar names its fork release.
      - name: Set version from tag
        run: mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      # Builds the phasetwo-ui theme too (frontend-maven-plugin). Same skips as upstream's release.
      - name: Build
        run: mvn -B package -Dmaven.test.skip=true -DskipITs -Dspotless.check.skip=true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target
          jar="keycloak-themes-${GITHUB_REF_NAME#v}.jar"
          sha256sum "$jar" | tee "$jar.sha256"
          gh release create "$GITHUB_REF_NAME" "$jar" "$jar.sha256" \
            --title "$GITHUB_REF_NAME" \
            --notes "Phase Two ${GITHUB_REF_NAME%%-fork.*} with the fork's changes. Built from ${GITHUB_SHA}."
